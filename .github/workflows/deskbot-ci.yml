name: DeskBot CI

# One workflow, two independent jobs:
#   - build-apk   -> Android debug APK (workflow Artifacts)
#   - deploy-pwa  -> app/www published to GitHub Pages
# Both run on every push to main and can be triggered manually from
# Actions -> "DeskBot CI" -> "Run workflow".

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deskbot-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  deploy-pwa:
    name: Deploy PWA to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
